{% extends "base.html" %}

{% block content %}

<div class="page-container">

    <div class="card entry-card">

        <div class="card-header">
            <h1>Exit & Payment</h1>
            <p>Process vehicle exit and complete payment.</p>
        </div>

        <form id="exitForm">

            <div class="form-group">
                <label for="ticketNumber">
                    Ticket Number
                </label>

                <input
                    type="text"
                    id="ticketNumber"
                    placeholder="PK-0018"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="form-group">
                <label for="paymentMethod">
                    Payment Method
                </label>

                <select id="paymentMethod" required>
                    <option value="">Select payment method</option>
                    <option value="CASH">Cash</option>
                    <option value="UPI">UPI</option>
                </select>
            </div>

            <button type="submit" class="primary-btn">
                Complete Payment
            </button>

        </form>

        <div id="exitMessage" class="message"></div>

        <div id="paymentResult" class="ticket-result hidden">

            <div class="success-icon">✓</div>

            <h2>Payment Successful</h2>

            <div class="ticket-details">

                <div>
                    <span>Ticket</span>
                    <strong id="exitTicket"></strong>
                </div>

                <div>
                    <span>Vehicle</span>
                    <strong id="exitVehicle"></strong>
                </div>

                <div>
                    <span>Vehicle Type</span>
                    <strong id="exitType"></strong>
                </div>

                <div>
                    <span>Parking Slot</span>
                    <strong id="exitSlot"></strong>
                </div>

                <div>
                    <span>Stay Duration</span>
                    <strong id="exitStay"></strong>
                </div>

                <div>
                    <span>Payment</span>
                    <strong id="exitPayment"></strong>
                </div>

                <div class="slot-highlight">
                    <span>Total Amount</span>
                    <strong id="exitAmount"></strong>
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
